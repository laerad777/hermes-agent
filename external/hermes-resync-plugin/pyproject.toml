[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-resync-plugin"
version = "0.1.0"
description = "Fail-closed continuity observer for Hermes lifecycle events"
requires-python = ">=3.11"

[project.entry-points."hermes_agent.plugins"]
hermes-resync = "hermes_resync:register"

[tool.hermes.plugin]
name = "hermes-resync"
key = "hermes-resync"
kind = "standalone"

[tool.hatch.build.targets.wheel]
packages = ["hermes_resync"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "hermes_resync/assets"
