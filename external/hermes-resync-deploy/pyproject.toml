[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-resync-deploy"
version = "0.1.0"
description = "Isolated, content-addressed deployment evidence for Hermes resynchronization"
requires-python = ">=3.11"

[project.scripts]
hermes-resync-deploy = "hermes_resync_deploy.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_resync_deploy*"]
